# Deploy/Update Scheduler for Job: email_alerts

substitutions:
  _JOB_NAME: email_alerts
  _SCHEDULER_NAME: run_email_alerts
  _REGION: us-east1
  _CRON: "0 * * * *"        # run hourly

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -ceu
      - |
        SA="$PROJECT_ID@appspot.gserviceaccount.com"
        EXEC_URI=$(gcloud run jobs describe "${_JOB_NAME}" --region "${_REGION}" --format='value(status.executionUri)')

        if gcloud scheduler jobs describe run-"${_SCHEDULER_NAME}" --location "${_REGION}" >/dev/null 2>&1; then
          echo "Updating scheduler run-${_SCHEDULER_NAME}"
          gcloud scheduler jobs update http "${_SCHEDULER_NAME}" \
            --location "${_REGION}" \
            --schedule "${_CRON}" \
            --uri "${EXEC_URI}" \
            --http-method POST \
            --oidc-service-account-email "${SA}"
        else
          echo "Creating scheduler ${_SCHEDULER_NAME}"
          gcloud scheduler jobs create http "${_SCHEDULER_NAME}" \
            --location "${_REGION}" \
            --schedule "${_CRON}" \
            --uri "${EXEC_URI}" \
            --http-method POST \
            --oidc-service-account-email "${SA}"
        fi

        # Ensure the scheduler SA can invoke the job
        gcloud run jobs add-iam-policy-binding scrape-a \
          --region "${_REGION}" \
          --member="serviceAccount:${SA}" \
          --role="roles/run.invoker" || true