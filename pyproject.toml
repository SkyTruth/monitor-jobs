[project]
name = "monitor-jobs"
version = "0.1.0"
description = "Cron jobs and scrapers to support monitor"
authors = [
    {name = "SkyTruth"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
ruff = "^0.14.2"
pre-commit = "^4.3.0"

[tool.poetry]
package-mode = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select=["E", "F", "UP", "B", "SIM", "I"]
