name: Deploy Jobs

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
# -------------------------------
#   BUILD / DEPLOY IMAGE
# ----------------------------

  build-and-push-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: skytruth-alerts2
          workload_identity_provider: "projects/33114313460/locations/global/workloadIdentityPools/github-pool/providers/github-actions"
          service_account: "github-deployer@skytruth-alerts2.iam.gserviceaccount.com"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: skytruth-alerts2

      - name: Submit Cloud Build
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          gcloud builds submit \
            --config ./infrastructure/cloudbuild.image.yaml \
            --substitutions=_COMMIT_SHA=$SHORT_SHA

# -------------------------------
#   EMAIL ALERTS
# ----------------------------

  deploy-email-alerts:
    needs: build-and-push-docker
    uses: ./.github/workflows/deploy-job.yaml
    with:
      job_name: "email-alerts"
      job_path: "src.jobs.email_alerts"

  deploy-email-alerts-scheduler:
    needs: deploy-email-alerts
    uses: ./.github/workflows/deploy-scheduler.yaml
    with:
      job_name: email-alerts
      scheduler_name: run-email-alerts
      schedule: "30 */4 * * *"  #Run at 30 minutes past every 4th hour.

# -------------------------------
#  FLORIDA SCRAPER
# ----------------------------

  deploy-florida-pollution:
    needs: build-and-push-docker
    uses: ./.github/workflows/deploy-job.yaml
    with:
      job_name: "florida-pollution-scraper"
      job_path: "src.jobs.fl_pollution_scraper"

  
  deploy-florida-pollution-scheduler:
    needs: deploy-florida-pollution
    uses: ./.github/workflows/deploy-scheduler.yaml
    with:
      job_name: florida-pollution-scraper
      scheduler_name: run-florida-pollution-scraper
      schedule: "55 2 * * *"  #Every day at 2:55am

# -------------------------------
#   PA PERMITS SCRAPER
# ----------------------------

  deploy-pa-permits:
    needs: build-and-push-docker
    uses: ./.github/workflows/deploy-job.yaml
    with:
      job_name: "pa-permits"
      job_path: "src.jobs.PAPermits"
      memory: "1Gi"
  
  deploy-pa-permits-scheduler:
    needs: deploy-pa-permits
    uses: ./.github/workflows/deploy-scheduler.yaml
    with:
      job_name: pa-permits
      scheduler_name: run-pa-permits
      schedule: "10 */6 * * *"  #Minute 10, every 6 hours 
      
# -------------------------------
#   PA SPUDS SCRAPER
# ----------------------------

  deploy-pa-spuds:
    needs: build-and-push-docker
    uses: ./.github/workflows/deploy-job.yaml
    with:
      job_name: "pa-spuds"
      job_path: "src.jobs.PASpuds"
      memory: "1Gi"

  deploy-pa-spuds-scheduler:
    needs: deploy-pa-spuds
    uses: ./.github/workflows/deploy-scheduler.yaml
    with:
      job_name: pa-spuds
      scheduler_name: run-pa-spuds
      schedule: "20 */6 * * *"  #Minute 20, every 6 hours          

# -------------------------------
#   PS VIOLATION SCRAPER
# ----------------------------

  deploy-pa-violations:
    needs: build-and-push-docker
    uses: ./.github/workflows/deploy-job.yaml
    with:
      job_name: "pa-violations"
      job_path: "src.jobs.PAViolations"
      memory: "1Gi"

  deploy-pa-violations-scheduler:
    needs: deploy-pa-violations
    uses: ./.github/workflows/deploy-scheduler.yaml
    with:
      job_name: pa-violations
      scheduler_name: run-pa-violations
      schedule: "15 */6 * * *"  #Minute 15, every 6 hours   

# -------------------------------
#   NRC SCRAPER
# ----------------------------

  deploy-nrc:
    needs: build-and-push-docker
    uses: ./.github/workflows/deploy-job.yaml
    with:
      job_name: "nrc"
      job_path: "src.jobs.nrc_scraper"

  deploy-nrc-scheduler:
    needs: deploy-nrc
    uses: ./.github/workflows/deploy-scheduler.yaml
    with:
      job_name: nrc
      scheduler_name: run-nrc
      schedule: "0 20 * * 4"  # Run at 8:00 PM every Thursday.

  deploy-load-planet-orders:
    needs: build-and-push-docker
    uses: ./.github/workflows/deploy-job.yaml
    with:
      job_name: "load-planet-orders"
      job_path: "src.jobs.load_planet_orders"

  deploy-load-planet-orders-scheduler:
    needs: deploy-load-planet-orders
    uses: ./.github/workflows/deploy-scheduler.yaml
    with:
      job_name: load-planet-orders
      scheduler_name: run-load-planet-orders
      schedule: "05 */6 * * *"  # Run at 5 minutes past every 6th hour.
# -------------------------------
#   TIFF TO TILES
# -------------------------------
  deploy-tiff-2-tiles:
    needs: build-and-push-docker
    uses: ./.github/workflows/deploy-job.yaml
    with:
      job_name: "tiff-2-tiles"
      job_path: "src.jobs.tiff_2_tiles"
      timeout: "3600s"
      memory: "1Gi"

  deploy-tiff-2-tiler:
    needs: deploy-tiff-2-tiles
    uses: ./.github/workflows/deploy-scheduler.yaml
    with:
      job_name: tiff-2-tiles
      scheduler_name: run-tiff-2-tiles
      schedule: "0 */12 * * *"  # Every 12 hours
