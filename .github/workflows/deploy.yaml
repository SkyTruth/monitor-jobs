  deploy-email-alerts:
    needs: build-and-push-docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: skytruth-alerts2
          workload_identity_provider: "projects/33114313460/locations/global/workloadIdentityPools/github-pool/providers/github-actions"
          service_account: "github-deployer@skytruth-alerts2.iam.gserviceaccount.com"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          version: '>= 516.0.0'
          project_id: skytruth-alerts2

      - name: Submit Cloud Build
        run: |
          gcloud builds submit \
            --config ./infrastructure/email_alerts/cloudbuild.job.yaml \
  
  deploy-email-alerts-scheduler:
    needs: [build-and-push-docker, deploy-email-alerts]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: skytruth-alerts2
          workload_identity_provider: "projects/33114313460/locations/global/workloadIdentityPools/github-pool/providers/github-actions"
          service_account: "github-deployer@skytruth-alerts2.iam.gserviceaccount.com"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: skytruth-alerts2

      - name: Submit Cloud Build
        run: |
          gcloud builds submit \
            --config ./infrastructure/email_alerts/cloudbuild.scheduler.yaml \